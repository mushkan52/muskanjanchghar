<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PathLab Pro — Pathology Lab Management Software</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --ink:#12203a; --muted:#6b7a90; --line:#e3e8f0;
  --brand:#0f6fde; --brand2:#0a56ad; --side:#0b1f3a; --side2:#0a1930;
  --ok:#1a9e63; --warn:#e08a00; --bad:#d63b3b; --hi:#c92a2a;
  --r:12px; --sh:0 6px 22px rgba(18,32,58,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Segoe UI",Roboto,system-ui,-apple-system,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--brand);text-decoration:none}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#08203f 0%,#0f6fde 60%,#16a3c9 100%);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.loginCard{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:min(420px,100%);padding:34px 30px;text-align:center}
.logoMark{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#0f6fde,#16a3c9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:26px;margin:0 auto 14px}
.loginCard h1{margin:0 0 4px;font-size:22px}
.loginCard p.sub{margin:0 0 22px;color:var(--muted);font-size:13px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(15,111,222,.12)}
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:10px 16px;border:none;border-radius:9px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand2)}
.btn.wide{width:100%;padding:12px}
.btn.ghost{background:#eef3fa;color:var(--ink)}
.btn.ghost:hover{background:#e2ebf7}
.btn.ok{background:var(--ok)} .btn.ok:hover{background:#148050}
.btn.bad{background:var(--bad)} .btn.bad:hover{background:#b02c2c}
.btn.warn{background:var(--warn)} .btn.warn:hover{background:#b96f00}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}

/* ---------- SHELL ---------- */
#app{display:flex;min-height:100vh}
aside{width:236px;background:var(--side);color:#c9d6ea;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:0 0 236px}
.brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
.brand .bm{flex:none;width:38px;height:38px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#0f6fde,#16a3c9);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.brand b{display:block;color:#fff;font-size:14px;line-height:1.2}
.brand span{font-size:11px;color:#8fa6c6}
nav{padding:10px 8px;overflow:auto;flex:1}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#c9d6ea;font-size:13.5px;margin-bottom:2px;cursor:pointer}
nav a:hover{background:rgba(255,255,255,.07);color:#fff}
nav a.active{background:linear-gradient(135deg,#0f6fde,#0a56ad);color:#fff;font-weight:600}
nav a .ic{width:20px;text-align:center;font-size:15px}
.sideFoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#8fa6c6}
.who{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:#16a3c9;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
.who b{color:#fff;font-size:12.5px;display:block}
.who small{color:#8fa6c6;font-size:11px;text-transform:capitalize}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:20}
header.top h2{margin:0;font-size:18px}
header.top .crumbs{color:var(--muted);font-size:12px}
.content{padding:20px 22px 60px}

/* ---------- UI ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g4,.g3,.g2{grid-template-columns:1fr}aside{display:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .hd h3{margin:0;font-size:14.5px}
.card .bd{padding:16px}
.kpi{padding:16px}
.kpi .lab{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.kpi .val{font-size:26px;font-weight:800;margin:6px 0 2px}
.kpi .delta{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{background:#f7f9fd;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0}
tbody tr:hover{background:#fafcff}
.tblWrap{max-height:520px;overflow:auto;border-radius:0 0 var(--r) var(--r)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.p-green{background:#e3f7ee;color:#0f7a4c}
.p-amber{background:#fdf0dc;color:#a86500}
.p-blue{background:#e5effd;color:#0a56ad}
.p-red{background:#fde7e7;color:#b02c2c}
.p-grey{background:#eef1f6;color:#5a6b82}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input.search{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;min-width:220px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.pickList{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.pickList .it{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;cursor:pointer}
.pickList .it:hover{background:#f6f9ff}
.pickList .it small{color:var(--muted);display:block;font-size:11.5px}
.chip{background:#eef3fa;border:1px solid #dce6f4;border-radius:99px;padding:4px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600}
.chip button{border:none;background:none;color:var(--bad);cursor:pointer;font-weight:700}
.flags{font-weight:800}
.fH{color:var(--hi)} .fL{color:#0a56ad}
.flagBadge{background:#fde7e7;color:#b02c2c;padding:2px 7px;border-radius:6px;font-weight:800;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(10,25,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow:auto}
.modal .box{background:#fff;border-radius:14px;width:min(760px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .box .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .box .bd{padding:18px}
.modal .box .ft{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.x{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.note{background:#f2f7ff;border:1px solid #d8e6fb;border-radius:9px;padding:11px 13px;font-size:12.5px;color:#31507a}
.tag{font-size:11px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:#eef1f6;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0f6fde,#16a3c9)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 13px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tabs button.active{color:var(--brand);border-bottom-color:var(--brand)}
.toast{position:fixed;bottom:22px;right:22px;background:#0b1f3a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:99;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s}
.toast.show{opacity:1;transform:none}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="loginCard">
    <div class="logoMark" id="loginLogo">PL</div>
    <h1 id="loginLab">PathLab Pro</h1>
    <p class="sub">Pathology Laboratory Management Software</p>
    <div class="field">
      <label>Username</label>
      <input id="lgUser" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="lgPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn wide" onclick="doLogin()">Sign In</button>
    <div class="err" id="lgErr"></div>
    <div class="hint">Default login: <b>admin</b> / <b>admin123</b><br><span id="loginSupport"></span></div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app" class="hidden">
  <aside>
    <div class="brand">
      <div class="bm" id="sideLogo">PL</div>
      <div><b id="sideLab">PathLab Pro</b><span id="sideTag">Diagnostics</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="sideFoot">
      <div class="who">
        <div class="avatar" id="meAv">A</div>
        <div><b id="meName">Admin</b><small id="meRole">admin</small></div>
      </div>
      <a onclick="doLogout()" style="color:#ffb4b4;font-size:12px;cursor:pointer">⎋ Sign out</a>
    </div>
  </aside>
  <main>
    <header class="top">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="crumbs" id="pageCrumb">Overview of your laboratory</div>
      </div>
      <div class="row">
        <input class="search" id="globalSearch" placeholder="Search patient / invoice / phone…" oninput="globalSearch(this.value)">
        <button class="btn" onclick="openNewPatient()">+ New Patient</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
/* ==========================================================
   PathLab Pro — single-file pathology lab management software
   Data is stored locally (localStorage) with JSON backup.
   ========================================================== */

const KEY='pathlab_pro_v3';
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>{if(!d)return'';const x=new Date(d);return pad(x.getDate())+'-'+pad(x.getMonth()+1)+'-'+x.getFullYear();};
const fmtDT=d=>{if(!d)return'';const x=new Date(d);return fmtDate(d)+' '+pad(x.getHours())+':'+pad(x.getMinutes());};
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtNum=v=>{if(v===''||v==null)return v;const n=parseFloat(v);if(isNaN(n))return v;return String(Math.round(n*1000)/1000);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------------- TEST CATALOG (seeded) ---------------- */
const T=(code,name,cat,price,sample,params)=>({id:uid(),code,name,category:cat,price,sampleType:sample,tat:'Same day',parameters:params});
const P=(name,unit,low,high)=>({name,unit,refLow:low,refHigh:high,type:'num'});
const TX=(name,options)=>({name,unit:'',refText:options.join(' / '),type:'text'});

function seedTests(){
 return [
  T('CBC','Complete Blood Count','Haematology',350,'EDTA Whole Blood',[
   P('Hemoglobin','g/dL',12,16),P('Total WBC Count','/cmm',4000,11000),P('RBC Count','million/cmm',4.2,5.8),
   P('Neutrophils','%',40,75),P('Lymphocytes','%',20,45),P('Eosinophils','%',1,6),P('Monocytes','%',2,10),
   P('Basophils','%',0,1),P('Platelet Count','lakh/cmm',1.5,4.5),P('PCV / HCT','%',36,50),
   P('MCV','fL',80,100),P('MCH','pg',27,32),P('MCHC','g/dL',32,36),P('RDW','%',11.5,14.5)]),
  T('ESR','Erythrocyte Sedimentation Rate','Haematology',120,'EDTA Whole Blood',[P('ESR','mm/hr',0,20)]),
  T('BG','Blood Group & Rh Typing','Haematology',150,'EDTA Whole Blood',[TX('Blood Group',['A','B','AB','O']),TX('Rh Factor',['Positive','Negative'])]),
  T('PTINR','Prothrombin Time / INR','Haematology',400,'Citrate Plasma',[P('Prothrombin Time','sec',11,14),P('INR','ratio',0.8,1.2)]),
  T('LFT','Liver Function Test','Biochemistry',650,'Serum',[
   P('Total Bilirubin','mg/dL',0.3,1.2),P('Direct Bilirubin','mg/dL',0,0.3),P('Indirect Bilirubin','mg/dL',0.2,0.9),
   P('SGOT (AST)','U/L',5,40),P('SGPT (ALT)','U/L',5,45),P('Alkaline Phosphatase','U/L',40,129),
   P('Total Protein','g/dL',6.4,8.3),P('Albumin','g/dL',3.5,5.2),P('Globulin','g/dL',2,3.5),P('A/G Ratio','ratio',1.0,2.1)]),
  T('KFT','Kidney Function Test','Biochemistry',650,'Serum',[
   P('Urea','mg/dL',15,40),P('Creatinine','mg/dL',0.6,1.3),P('Uric Acid','mg/dL',3.5,7.2),
   P('Sodium','mEq/L',135,145),P('Potassium','mEq/L',3.5,5.1),P('Chloride','mEq/L',98,107),P('Calcium','mg/dL',8.5,10.5)]),
  T('LIPID','Lipid Profile','Biochemistry',550,'Serum',[
   P('Total Cholesterol','mg/dL',125,200),P('Triglycerides','mg/dL',40,150),P('HDL Cholesterol','mg/dL',40,60),
   P('LDL Cholesterol','mg/dL',60,130),P('VLDL Cholesterol','mg/dL',5,40),P('Chol / HDL Ratio','ratio',0,4.5)]),
  T('FBS','Blood Sugar Fasting','Biochemistry',80,'Fluoride Plasma',[P('Glucose (Fasting)','mg/dL',70,100)]),
  T('PPBS','Blood Sugar Post Prandial','Biochemistry',80,'Fluoride Plasma',[P('Glucose (PP)','mg/dL',70,140)]),
  T('HBA1C','Glycated Haemoglobin HbA1c','Biochemistry',450,'EDTA Whole Blood',[P('HbA1c','%',4,5.6)]),
  T('TFT','Thyroid Profile (T3 T4 TSH)','Biochemistry',700,'Serum',[
   P('T3 (Triiodothyronine)','ng/mL',0.8,2.0),P('T4 (Thyroxine)','µg/dL',5.1,14.1),P('TSH','µIU/mL',0.27,4.2)]),
  T('URINE','Urine Routine & Microscopy','Clinical Pathology',200,'Midstream Urine',[
   TX('Colour',['Pale Yellow','Yellow','Dark Yellow','Amber','Red']),TX('Appearance',['Clear','Slightly Turbid','Turbid']),
   P('pH','pH',4.6,8.0),P('Specific Gravity','g/mL',1.005,1.030),
   TX('Protein',['Absent','Trace','1+','2+','3+']),TX('Glucose',['Absent','Trace','1+','2+','3+']),
   TX('Ketone Bodies',['Absent','Present']),TX('Blood',['Absent','Trace','Present']),TX('Bilirubin',['Absent','Present']),
   TX('Nitrite',['Negative','Positive']),TXN('Pus Cells','/hpf'),TXN('RBCs','/hpf'),TXN('Epithelial Cells','/hpf'),
   TX('Casts',['Absent','Hyaline','Granular']),TX('Crystals',['Absent','Calcium Oxalate','Uric Acid','Triple Phosphate'])]),
  T('CRP','C-Reactive Protein (Quantitative)','Immunology',500,'Serum',[P('CRP','mg/L',0,6)]),
  T('DENGUE','Dengue Profile (NS1 IgM IgG)','Serology',900,'Serum',[TX('NS1 Antigen',['Negative','Positive']),TX('IgM',['Negative','Positive']),TX('IgG',['Negative','Positive'])]),
  T('WIDAL','Widal Test','Serology',300,'Serum',[TX('S. typhi O',['1:40','1:80','1:160','1:320']),TX('S. typhi H',['1:40','1:80','1:160','1:320']),TX('S. paratyphi AH',['1:40','1:80','1:160','1:320']),TX('S. paratyphi BH',['1:40','1:80','1:160','1:320'])]),
  T('VDRL','VDRL / RPR Test','Serology',200,'Serum',[TX('VDRL',['Non Reactive','Reactive'])]),
  T('HBSAG','HBsAg Screening','Serology',350,'Serum',[TX('HBsAg',['Non Reactive','Reactive'])]),
  T('HIV','HIV 1 & 2 Antibody Screening','Serology',400,'Serum',[TX('HIV I & II',['Non Reactive','Reactive'])]),
  T('TROP','Troponin-I','Biochemistry',900,'Serum',[P('Troponin-I','ng/mL',0,0.04)]),
  T('SAMP','Semen Analysis','Clinical Pathology',400,'Semen',[
   P('Volume','mL',1.5,5),P('Sperm Count','million/mL',15,150),P('Total Motility','%',40,100),P('Normal Forms','%',4,100)]),
  T('STOOL','Stool Routine Examination','Clinical Pathology',180,'Stool',[
   TX('Colour',['Brown','Yellow','Green','Black']),TX('Consistency',['Formed','Semi-formed','Loose','Watery']),
   TX('Occult Blood',['Negative','Positive']),TXN('Ova / Cysts','/hpf'),TXN('Pus Cells','/hpf')])
 ];
}
const TXN=(name,unit)=>({name,unit,refText:'Nil / Not seen',type:'text'});

/* ---------------- DEFAULT STATE ---------------- */
function defaultState(){
 const tests=seedTests();
 return {
  settings:{
   labName:'Muskan Diagnostic', tagline:'Pathology & Diagnostic Centre',
   address:'Main Road, Civil Lines', city:'', phone:'+91 00000 00000', email:'info@muskanlab.in',
   website:'www.muskanlab.in', gstin:'', gstDefault:0, currency:'₹',
   pathologist1:'Dr. A. Sharma', pathologist1Q:'MD (Pathology)',
   pathologist2:'Dr. R. Verma', pathologist2Q:'MD (Biochemistry)',
   technician:'Mr. S. Khan', showBarcode:true, showQR:true, upiId:'', logo:'', regNo:'',
   whatsapp:'+91 00000 00000',
   support:{name:'PathLab Support',phone:'+91 00000 00000',email:'support@muskanlab.in'},
   cloud:{url:'',key:''}
  },
  users:[
   {id:uid(),username:'admin',password:'admin123',name:'Administrator',role:'admin'},
   {id:uid(),username:'reception',password:'recep123',name:'Reception Desk',role:'receptionist'},
   {id:uid(),username:'lab',password:'lab123',name:'Lab Technician',role:'technician'},
   {id:uid(),username:'doctor',password:'doc123',name:'Dr. A. Sharma',role:'pathologist'},
   {id:uid(),username:'accounts',password:'acct123',name:'Accounts',role:'accountant'}
  ],
  doctors:[
   {id:uid(),name:'Dr. S. Mehta',qualification:'MBBS, MD',speciality:'General Physician',commissionPct:10,phone:''},
   {id:uid(),name:'Dr. P. Nair',qualification:'MBBS, DNB',speciality:'Physician',commissionPct:8,phone:''},
   {id:uid(),name:'Self / Walk-in',qualification:'',speciality:'',commissionPct:0,phone:''}
  ],
  tests, patients:[], invoices:[], bookings:[],
  counters:{mrn:1,inv:1,bk:1}, qrCache:{}
 };
}
let S=load();
function load(){ try{const r=localStorage.getItem(KEY); if(r){const s=JSON.parse(r); if(s&&s.tests&&s.tests.length) return s; }}catch(e){} const s=defaultState(); try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){} return s; }
function save(n){ S=n||S; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Storage full — export a backup');} }
let ME=null, VIEW='dashboard';

/* ---------------- AUTH ---------------- */
function doLogin(){
 const u=document.getElementById('lgUser').value.trim(), p=document.getElementById('lgPass').value;
 const user=S.users.find(x=>x.username===u&&x.password===p);
 if(!user){document.getElementById('lgErr').textContent='Invalid username or password';return;}
 ME=user; sessionStorage.setItem('pl_user',user.id);
 document.getElementById('login').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');
 paintChrome(); go('dashboard');
 toast('Welcome, '+user.name);
}
function doLogout(){ ME=null; sessionStorage.removeItem('pl_user'); document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); document.getElementById('lgPass').value=''; }
function restoreSession(){ const id=sessionStorage.getItem('pl_user'); if(id){const u=S.users.find(x=>x.id===id); if(u){ME=u;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');paintChrome();go('dashboard');}} }
function paintChrome(){
 const st=S.settings;
 document.getElementById('sideLab').textContent=st.labName;
 document.getElementById('sideTag').textContent=st.tagline||'';

const patientById=id=>S.patients.find(p=>p.id===id)||{name:'—'};
const doctorById=id=>S.doctors.find(d=>d.id===id)||{name:'—',commissionPct:0};
const testById=id=>S.tests.find(t=>t.id===id);
function invTotal(inv){ return inv.items.reduce((a,i)=>a+i.price,0); }
function invComputed(inv){
 const sub=invTotal(inv); const disc=+(inv.discount||0); const taxable=Math.max(0,sub-disc);
 const gstPct=+(inv.gstPct||0); const gst=taxable*gstPct/100; const total=taxable+gst;
 const paid=+(inv.paid||0); return {sub,disc,taxable,gst,total,paid,due:total-paid};
}
function flag(p,v){
 if(p.type!=='num'||v===''||v==null) return '';
 const n=parseFloat(v); if(isNaN(n)) return '';
 const lo=parseFloat(p.refLow), hi=parseFloat(p.refHigh);
 if(!isNaN(lo)&&n<lo) return 'L';
 if(!isNaN(hi)&&n>hi) return 'H';
 return 'N';
}
function resultsFor(invId){ return S.invoices.find(i=>i.id===invId)?.results||{}; }
function statusOf(inv){ const r=inv.results||{}; const ids=Object.keys(r);
 if(!ids.length) return 'Pending';
 const st=ids.map(k=>r[k].status);
 if(st.every(x=>x==='Printed')) return 'Printed';
 if(st.every(x=>x==='Verified'||x==='Printed')) return 'Verified';
 if(st.some(x=>x==='Verified'||x==='Printed')) return 'Partial';
 return 'Draft';
}
function pillFor(s){ const m={'Paid':'p-green','Partial':'p-amber','Unpaid':'p-red','Verified':'p-blue','Printed':'p-green','Draft':'p-grey','Pending':'p-amber','Partial ':'p-amber','Collected':'p-blue','Reported':'p-green','Collected / Reported':'p-green'}; return '<span class="pill '+(m[s]||'p-grey')+'">'+esc(s)+'</span>'; }

 <div class="split" style="grid-template-columns:1fr 1fr;margin-bottom:14px">

     <div class="bd">${top.length?top.map(([n,c])=>`<div style="margin-bottom:10px"><div class="row"><span style="font-size:13px">${esc(n)}</span><span class="spacer"></span><b>${c}</b></div><div class="bar"><i style="width:${(c/maxTop*100).toFixed(0)}%"></i></div></div>`).join(''):'<div class="empty">No data yet</div>'}</div></div>
 </div>
 <div class="card"><div class="hd"><h3>Recent Invoices</h3><button class="btn sm ghost" onclick="go('billing')">Open billing</button></div>
  <div class="tblWrap"><table><thead><tr><th>Invoice</th><th>Patient</th><th>Tests</th><th>Total</th><th>Paid</th><th>Status</th><th>Report</th></tr></thead><tbody>

  </tbody></table></div></div>`;
}
function kpi(l,v,d){ return `<div class="card kpi"><div class="lab">${l}</div><div class="val">${v}</div><div class="delta">${esc(d)}</div></div>`; }
function bars(data){
 const h=170,w=Math.max(320,data.length*62),max=Math.max(1,...data.map(d=>d.max||d.v));
 const bw=Math.min(46,(w/data.length)-16);
 return `<svg viewBox="0 0 ${w} ${h+34}" style="width:100%;height:200px">
 ${[0,.25,.5,.75,1].map(f=>{const y=10+(h-30)*(1-f); return `<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#eef1f6"/>`;}).join('')}
 ${data.map((d,i)=>{const bh=Math.max(2,(d.v/max)*(h-40)); const x=i*(w/data.length)+((w/data.length)-bw)/2; const y=h-20-bh;
  return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="url(#g1)"/>
  <text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10" fill="#6b7a90">${d.v?(d.m?d.m(d.v):d.v):''}</text>
  <text x="${x+bw/2}" y="${h+2}" text-anchor="middle" font-size="10" fill="#6b7a90">${esc(d.label)}</text>`;}).join('')}
 <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16a3c9"/><stop offset="1" stop-color="#0f6fde"/></linearGradient></defs>
 </svg>`;
}

function barcodeSVG(text){
 try{ if(window.JsBarcode){ const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); JsBarcode(svg,text,{format:'CODE128',displayValue:true,height:46,width:1.6,fontSize:12,margin:2}); return svg.outerHTML; } }catch(e){}
 let x=0,bars=''; for(let i=0;i<text.length;i++){const c=text.charCodeAt(i); for(let b=0;b<4;b++){const w=((c>>(b*2))&3)+1; bars+=`<rect x="${x}" y="0" width="${w}" height="46" fill="#12203a"/>`; x+=w+2;}}
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} 68" style="width:260px;height:68px">${bars}<text x="${(x+10)/2}" y="62" text-anchor="middle" font-size="12" font-family="monospace" fill="#12203a">${esc(text)}</text></svg>`;
}

  <td class="row">${!i.collectedAt?`<button class="btn sm ok" onclick="markCollected('${i.id}')">Mark Collected</button>`:''}<button class="btn sm ghost" onclick="printLabel('${i.id}')">🖨 Barcode Label</button></td></tr>`;}).join(''):'<tr><td colspan="5" class="empty">No samples — create an invoice first</td></tr>'}

function openResult(invId){

 i.results=i.results||{};
 const body=i.items.map(it=>{
  const t=testById(it.testId); if(!t) return '';
  const r=i.results[it.testId]||{values:{},remarks:'',status:'Draft',verifiedBy:'',verifiedAt:'',printedAt:''};
  i.results[it.testId]=r;
  return `<div class="card" style="margin-bottom:12px"><div class="hd"><h3>${esc(t.name)} <span class="tag">${esc(t.category)}</span></h3><span id="st_${it.testId}">${pillFor(r.status)}</span></div><div class="bd">
   <table><thead><tr><th style="width:34%">Parameter</th><th style="width:18%">Result</th><th style="width:10%">Unit</th><th style="width:20%">Reference Range</th><th>Flag</th></tr></thead><tbody>
   ${t.parameters.map((pa,pi)=>{
     const val=r.values[pa.name]||''; const f=flag(pa,val); 
     const ref=pa.type==='num'?((isNaN(parseFloat(pa.refLow))?'—':pa.refLow)+' – '+(isNaN(parseFloat(pa.refHigh))?'—':pa.refHigh)):(pa.refText||'—');
     return `<tr><td>${esc(pa.name)}</td>
      <td>${pa.type==='num'?`<input type="number" step="any" style="width:100%;padding:6px 8px;border:1px solid #e3e8f0;border-radius:7px" value="${esc(val)}" oninput="setVal('${invId}','${it.testId}','${esc(pa.name).replace(/'/g,"\\'")}',this.value)">`:
        `<select style="width:100%;padding:6px 8px;border:1px solid #e3e8f0;border-radius:7px" onchange="setVal('${invId}','${it.testId}','${esc(pa.name).replace(/'/g,"\\'")}',this.value)"><option value="">—</option>${(pa.refText||'').split(' / ').map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}</td>
      <td class="tag">${esc(pa.unit||'')}</td><td class="tag">${esc(ref)}</td>
      <td id="fl_${it.testId}_${pi}">${f==='H'?'<span class="flags fH">H ▲</span>':f==='L'?'<span class="flags fL">L ▼</span>':f==='N'?'<span style="color:#1a9e63">Normal</span>':''}</td></tr>`;}).join('')}
   </tbody></table>
   <div class="field" style="margin-top:10px"><label>Remarks / Interpretation</label><textarea rows="2" oninput="setRemarks('${invId}','${it.testId}',this.value)">${esc(r.remarks||'')}</textarea></div>
   <div class="row">
     ${r.status==='Draft'?`<button class="btn warn sm" onclick="verifyResult('${invId}','${it.testId}')">✔ Verify as ${esc(ME.role==='pathologist'?ME.name:'Pathologist')}</button>`:''}
     ${r.status!=='Draft'?`<span class="tag">Verified by ${esc(r.verifiedBy)} on ${fmtDT(r.verifiedAt)}</span>`:''}
     <button class="btn ghost sm" onclick="unverify('${invId}','${it.testId}')">↺ Reopen as Draft</button>
     <span class="spacer"></span><button class="btn ghost sm" onclick="printReport('${invId}','${it.testId}')">🖨 Print Report</button>

 }).join('');
 modal('Result Entry — '+i.no+' · '+p.name,`<div class="note" style="margin-bottom:12px">${esc(p.mrn||'')} · ${esc(p.age||'')}/${esc(p.sex||'')} · ${esc(p.phone||'')} · Ref: ${esc(doctorById(i.doctorId).name)} · Invoice ${esc(i.no)}</div>`+body,
  '<button class="btn ghost" onclick="save();closeModal();render()">Save & Close</button>',true);
}
function setVal(invId,testId,pname,v){
 const i=S.invoices.find(x=>x.id===invId); const r=i.results[testId]; r.values[pname]=v;
 const t=testById(i.items.find(x=>x.testId===testId).testId); const pa=t.parameters.find(x=>x.name===pname); const f=flag(pa,v);
 const cell=document.getElementById('fl_'+testId+'_'+t.parameters.indexOf(pa));
 if(cell) cell.innerHTML=f==='H'?'<span class="flags fH">H ▲</span>':f==='L'?'<span class="flags fL">L ▼</span>':f==='N'?'<span style="color:#1a9e63">Normal</span>':'';
 save();
}

function verifyResult(invId,testId){ const i=S.invoices.find(x=>x.id===invId); const r=i.results[testId]; r.status='Verified'; r.verifiedBy=ME.name; r.verifiedAt=new Date().toISOString(); save(); openResult(invId); toast('Result verified'); }

async function printReport(invId,onlyTestId){

 const items=onlyTestId?i.items.filter(x=>x.testId===onlyTestId):i.items;

 const sections=items.map(it=>{

  }).join('');
  return `<div class="rptTest"><div class="dhead">${esc(t.name)} <span>(${esc(t.category)})</span></div>
   <table class="rt"><thead><tr><th>Investigation</th><th style="text-align:center">Result</th><th style="text-align:center">Unit</th><th style="text-align:center">Bio. Ref. Interval</th><th style="text-align:center">Flag</th></tr></thead><tbody>${rows}</tbody></table>

 }).join('');
 const bar=st.showBarcode?barcodeSVG(i.no):'';
 const html=`<div class="page">

    <div><div class="ln">${esc(st.labName)}</div><div class="tg">${esc(st.tagline||'')}</div>${st.regNo?`<div class="reg">${esc(st.regNo)}</div>`:''}</div></div>
   <div class="lh-contact">${esc(st.address)}${st.city?'<br>'+esc(st.city):''}<br>Ph: ${esc(st.phone)} · ${esc(st.email)}<br>${esc(st.website)}${st.gstin?' · GSTIN '+esc(st.gstin):''}</div>
  </div>
  <div class="lh-bar"></div>
  <div class="lh-title">Laboratory Test Report</div>
  <div class="metaRow">
   <div class="pinfo">
    <div><span>Patient Name</span><b>${esc(p.name)}</b></div>
    <div><span>Age / Sex</span><b>${esc(p.age||'—')} / ${esc(p.sex||'—')}</b></div>

    <div><span>Referred By</span><b>${esc(d.name)}</b></div>

    <div><span>Report Date</span><b>${fmtDT(new Date().toISOString())}</b></div>

  </div>
  <div class="foot">${esc(st.labName)} · ${esc(st.address)} · ${esc(st.phone)} — Computer generated report${st.gstin?' · GSTIN '+esc(st.gstin):''}. Support: ${esc(st.support.name)} (${esc(st.support.phone)})</div>
 </div>`;
 // mark printed after printing
 items.forEach(it=>{ const r=i.results[it.testId]; if(r){ r.status='Printed'; r.printedAt=new Date().toISOString(); } });
 save();

function makeQR(text){
 return new Promise(res=>{
  if(!window.QRCode){ res(''); return; }
  try{ QRCode.toDataURL(text,{margin:1,width:110},(e,url)=>res(e?'':'<img src="'+url+'" style="width:80px;height:80px">')); }catch(e){ res(''); }
 });
}

 w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>
 ${isReport?reportCSS():''}
 body{font-family:Arial,Helvetica,sans-serif;color:#12203a;margin:14px}
 .page{max-width:800px;margin:0 auto}
 @media print{ @page{size:A4;margin:10mm} body{margin:0} .noprint{display:none} }

 w.document.close();
}

function saveBooking(){
 const name=document.getElementById('bkName').value.trim(), phone=document.getElementById('bkPhone').value.trim();
 if(!name||!phone){toast('Name and mobile are required');return;}
 const sel=[...document.getElementById('bkTests').selectedOptions].map(o=>o.value);
 const b={ id:'BK-'+String(S.counters.bk++).padStart(4,'0'), name, phone, age:document.getElementById('bkAge').value.trim(),
  sex:document.getElementById('bkSex').value, date:document.getElementById('bkDate').value, slot:document.getElementById('bkSlot').value,
  home:document.getElementById('bkHome').value==='1', address:document.getElementById('bkAddr').value.trim(),
  tests:sel, status:'New', createdAt:new Date().toISOString() };
 S.bookings.push(b); save(); closeModal(); render(); toast('Booking '+b.id+' recorded');
}
function convertBooking(id){
 const b=S.bookings.find(x=>x.id===id); if(!b)return;
 // create patient + invoice
 const doc=S.doctors[S.doctors.length-1].id;
 const mrn='MD-'+String(S.counters.mrn++).padStart(4,'0');
 const p={id:uid(),mrn,name:b.name,age:b.age,sex:b.sex,phone:b.phone,email:'',address:b.address||'',doctorId:doc,createdAt:new Date().toISOString()};
 S.patients.push(p);
 const items=b.tests.map(n=>{const t=S.tests.find(x=>x.name===n); return {testId:t?t.id:'',name:n,price:t?t.price:0};});
 const inv={id:uid(),no:'INV-'+new Date().getFullYear()+String(S.counters.inv++).padStart(4,'0'),patientId:p.id,doctorId:doc,items,discount:0,gstPct:S.settings.gstDefault,paid:0,paymentMode:'Cash',createdAt:new Date().toISOString(),results:{}};
 S.invoices.push(inv); b.status='Converted'; b.invoiceId=inv.id; save(); render(); toast('Converted to invoice '+inv.no);
}
function delBooking(id){ if(!confirm('Delete booking '+id+'?'))return; S.bookings=S.bookings.filter(b=>b.id!==id); save(); render(); }

/* ---------------- ANALYTICS ---------------- */
function vAnalytics(){
 const invs=S.invoices; const total=invs.reduce((a,i)=>a+invComputed(i).total,0);
 const collected=invs.reduce((a,i)=>a+invComputed(i).paid,0);
 const byCat={}; invs.forEach(i=>i.items.forEach(it=>{const t=S.tests.find(x=>x.id===it.testId); const c=t?t.category:'Other'; byCat[c]=(byCat[c]||0)+it.price;}));
 const byMode={}; invs.forEach(i=>{byMode[i.paymentMode]=(byMode[i.paymentMode]||0)+invComputed(i).paid;});
 const byDoc={}; invs.forEach(i=>{const c=invComputed(i); const d=doctorById(i.doctorId); byDoc[d.name]=(byDoc[d.name]||0)+c.taxable*d.commissionPct/100;});
 const months={}; invs.forEach(i=>{const k=i.createdAt.slice(0,7); months[k]=(months[k]||0)+invComputed(i).total;});
 const mKeys=Object.keys(months).sort(); const maxM=Math.max(1,...Object.values(months));
 const catEntries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const maxC=Math.max(1,...catEntries.map(x=>x[1]));
 return `<div class="grid g4" style="margin-bottom:14px">
  ${kpi('Gross Revenue',money(total),invs.length+' invoices')}
  ${kpi('Collected',money(collected),'Collection rate '+(total?(collected/total*100).toFixed(1):'0')+'%')}
  ${kpi('Outstanding',money(total-collected),'To be recovered')}
  ${kpi('Avg Bill Value',money(invs.length?total/invs.length:0),'Per invoice')}
 </div>
 <div class="grid g2" style="margin-bottom:14px">
  <div class="card"><div class="hd"><h3>Monthly Revenue</h3></div><div class="bd">${mKeys.length?bars(mKeys.map(k=>({label:k,v:months[k],m:money,max:maxM}))):'<div class="empty">No data</div>'}</div></div>
  <div class="card"><div class="hd"><h3>Revenue by Test Category</h3></div><div class="bd">
   ${catEntries.length?catEntries.map(([n,v])=>`<div style="margin-bottom:10px"><div class="row"><span>${esc(n)}</span><span class="spacer"></span><b>${money(v)}</b></div><div class="bar"><i style="width:${(v/maxC*100).toFixed(0)}%"></i></div></div>`).join(''):'<div class="empty">No data</div>'}</div></div>
 </div>
 <div class="grid g2">
  <div class="card"><div class="hd"><h3>Payments by Mode</h3></div><div class="bd"><table><thead><tr><th>Mode</th><th>Amount</th></tr></thead><tbody>${Object.entries(byMode).map(([m,v])=>`<tr><td>${esc(m)}</td><td>${money(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No payments</td></tr>'}</tbody></table></div></div>
  <div class="card"><div class="hd"><h3>Doctor Commission Payable</h3></div><div class="bd"><table><thead><tr><th>Doctor</th><th>Commission</th></tr></thead><tbody>${Object.entries(byDoc).map(([d,v])=>`<tr><td>${esc(d)}</td><td>${money(v)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No data</td></tr>'}</tbody></table></div></div>
 </div>`;
}

function paramRow(p,i){
 p=p||{name:'',unit:'',refLow:'',refHigh:'',type:'num',refText:''};
 return `<div class="row" style="margin-bottom:6px" data-prow>
  <input placeholder="Parameter name" value="${esc(p.name)}" data-p="name" style="flex:2;padding:7px;border:1px solid #e3e8f0;border-radius:7px">
  <input placeholder="Unit" value="${esc(p.unit||'')}" data-p="unit" style="flex:1;padding:7px;border:1px solid #e3e8f0;border-radius:7px">
  <select data-p="type" style="padding:7px;border:1px solid #e3e8f0;border-radius:7px"><option value="num" ${p.type==='num'?'selected':''}>Numeric</option><option value="text" ${p.type==='text'?'selected':''}>Text options</option></select>
  <input placeholder="Low" value="${esc(p.refLow==null?'':p.refLow)}" data-p="refLow" style="width:70px;padding:7px;border:1px solid #e3e8f0;border-radius:7px">
  <input placeholder="High" value="${esc(p.refHigh==null?'':p.refHigh)}" data-p="refHigh" style="width:70px;padding:7px;border:1px solid #e3e8f0;border-radius:7px">
  <input placeholder="Text options (a / b / c)" value="${esc(p.refText||'')}" data-p="refText" style="flex:2;padding:7px;border:1px solid #e3e8f0;border-radius:7px">
  <button class="x" onclick="this.closest('[data-prow]').remove()">✕</button></div>`;
}
function addParamRow(){ const d=document.createElement('div'); d.innerHTML=paramRow({},0); document.getElementById('paramRows').appendChild(d.firstElementChild); }
function saveTest(id){
 const name=document.getElementById('tName').value.trim(); if(!name){toast('Test name required');return;}
 const params=[...document.querySelectorAll('[data-prow]')].map(r=>{
  const g=k=>r.querySelector('[data-p="'+k+'"]').value;
  const type=g('type');
  return {name:g('name'),unit:g('unit'),type,refLow:type==='num'&&g('refLow')!==''?parseFloat(g('refLow')):null,refHigh:type==='num'&&g('refHigh')!==''?parseFloat(g('refHigh')):null,refText:g('refText')};
 }).filter(p=>p.name);
 const data={code:document.getElementById('tCode').value.trim()||name.slice(0,4).toUpperCase(),name,category:document.getElementById('tCat').value.trim(),price:+document.getElementById('tPrice').value||0,sampleType:document.getElementById('tSample').value.trim(),tat:document.getElementById('tTat').value.trim(),parameters:params};
 if(id) Object.assign(testById(id),data); else S.tests.push(Object.assign({id:uid()},data));
 save(); closeModal(); render(); toast('Test saved');
}
function delTest(id){ if(!confirm('Delete this test from the catalog?'))return; S.tests=S.tests.filter(t=>t.id!==id); save(); render(); }

 <div class="field"><label>Default GST %</label><select id="sGst">${[0,5,12,18].map(g=>`<option value="${g}" ${st.gstDefault==g?'selected':''}>${g}%</option>`).join('')}</select></div>
 <div class="field"><label>WhatsApp Number</label><input id="sWa" value="${esc(st.whatsapp)}"></div>
 <div class="field"><label>UPI ID (for payment QR)</label><input id="sUpi" value="${esc(st.upiId||'')}" placeholder="e.g. muskanlab@upi"></div>
 <div class="field"><label>Lab Logo</label>
  <div style="display:flex;align-items:center;gap:12px">
   <div style="width:58px;height:58px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fbfcfe">${st.logo?`<img src="${st.logo}" style="width:100%;height:100%;object-fit:contain">`:esc(initials(st.labName))}</div>
   <input type="file" id="sLogo" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="onLogoPick(this)" style="max-width:230px">
   ${st.logo?`<button type="button" class="btn sm ghost" onclick="clearLogo()">Remove</button>`:''}
  </div>
  <div class="tag" style="margin-top:6px">PNG / JPG / WebP / SVG — square logo best (under 1 MB). Replaces the initials on invoice, report, sidebar and login.</div></div></div>
 <div class="field"><label>Address</label><textarea id="sAddr" rows="2">${esc(st.address)}</textarea></div>
 <div class="field"><label>City</label><input id="sCity" value="${esc(st.city)}"></div>
 <button class="btn" onclick="saveLab()">Save Profile</button>`; }
function saveLab(){
 Object.assign(S.settings,{labName:document.getElementById('sLab').value.trim()||'My Lab',tagline:document.getElementById('sTag').value.trim(),phone:document.getElementById('sPhone').value.trim(),email:document.getElementById('sEmail').value.trim(),website:document.getElementById('sWeb').value.trim(),gstin:document.getElementById('sGstin').value.trim(),gstDefault:+document.getElementById('sGst').value,whatsapp:document.getElementById('sWa').value.trim(),address:document.getElementById('sAddr').value.trim(),city:document.getElementById('sCity').value.trim(),upiId:document.getElementById('sUpi').value.trim(),regNo:document.getElementById('sRegNo').value.trim()});
 save(); paintChrome(); render(); toast('Profile saved');
}
function onLogoPick(inp){
 const f=inp.files&&inp.files[0]; if(!f) return;
 if(!/^image\/(png|jpe?g|webp|svg\+xml)$/.test(f.type)){ toast('Please choose a PNG, JPG, WebP or SVG image'); inp.value=''; return; }
 if(f.size>1024*1024){ toast('Logo too large — please use an image under 1 MB'); inp.value=''; return; }
 const r=new FileReader();
 r.onload=()=>{ S.settings.logo=r.result; save(); paintChrome(); render(); toast('Logo updated'); };
 r.readAsDataURL(f);
}
function clearLogo(){ S.settings.logo=''; save(); paintChrome(); render(); toast('Logo removed'); }
function usersTab(){
 return `<div class="toolbar"><button class="btn" onclick="editUser()">+ Add User</button></div>
 <table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Password</th><th>Actions</th></tr></thead><tbody>
 ${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${pillFor(u.role)}</td><td class="tag">${esc(u.password)}</td>
  <td class="row"><button class="btn sm ghost" onclick="editUser('${u.id}')">Edit</button>${u.id!==ME.id?`<button class="btn sm bad" onclick="delUser('${u.id}')">Delete</button>`:''}</td></tr>`).join('')}
 </tbody></table><div class="note" style="margin-top:12px">Roles: <b>admin</b> (all), <b>receptionist</b> (patients, billing, bookings, samples), <b>technician</b> (samples, results, tests), <b>pathologist</b> (results, reports, analytics), <b>accountant</b> (billing, reports, analytics, doctors).</div>`;
}
function editUser(id){
 const u=id?S.users.find(x=>x.id===id):{name:'',username:'',password:'',role:'receptionist'};
 modal(id?'Edit User':'New User',`<div class="grid g2">
  <div class="field"><label>Full Name</label><input id="uName" value="${esc(u.name)}"></div>
  <div class="field"><label>Username</label><input id="uUser" value="${esc(u.username)}"></div>
  <div class="field"><label>Password</label><input id="uPass" value="${esc(u.password)}"></div>
  <div class="field"><label>Role</label><select id="uRole">${['admin','receptionist','technician','pathologist','accountant'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div></div>`,
 `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveUser('${id||''}')">Save</button>`);
}
function saveUser(id){
 const uname=document.getElementById('uUser').value.trim(); if(!uname){toast('Username required');return;}
 const data={name:document.getElementById('uName').value.trim()||uname,username:uname,password:document.getElementById('uPass').value||'1234',role:document.getElementById('uRole').value};
 if(id) Object.assign(S.users.find(x=>x.id===id),data); else S.users.push(Object.assign({id:uid()},data));
 save(); closeModal(); render(); toast('User saved');
}
function delUser(id){ if(!confirm('Delete this user?'))return; S.users=S.users.filter(u=>u.id!==id); save(); render(); }
function reportTab(){ const st=S.settings; return `<div class="grid g2">
 <div class="field"><label>Lab Technician</label><input id="rTech" value="${esc(st.technician)}"></div>
 <div class="field"><label>Show Barcode on Report</label><select id="rBar"><option value="1" ${st.showBarcode?'selected':''}>Yes</option><option value="0" ${!st.showBarcode?'selected':''}>No</option></select></div>
 <div class="field"><label>Pathologist 1</label><input id="rP1" value="${esc(st.pathologist1)}"></div>
 <div class="field"><label>Qualification 1</label><input id="rP1Q" value="${esc(st.pathologist1Q)}"></div>
 <div class="field"><label>Pathologist 2</label><input id="rP2" value="${esc(st.pathologist2)}"></div>
 <div class="field"><label>Qualification 2</label><input id="rP2Q" value="${esc(st.pathologist2Q)}"></div></div>
 <button class="btn" onclick="saveReportOpts()">Save</button>`; }
function saveReportOpts(){ Object.assign(S.settings,{technician:document.getElementById('rTech').value.trim(),showBarcode:document.getElementById('rBar').value==='1',pathologist1:document.getElementById('rP1').value.trim(),pathologist1Q:document.getElementById('rP1Q').value.trim(),pathologist2:document.getElementById('rP2').value.trim(),pathologist2Q:document.getElementById('rP2Q').value.trim()}); save(); toast('Saved'); }
function webTab(){ const s=S.settings; return `<div class="note" style="margin-bottom:12px">Share these details on your website so patients can book tests online. Bookings appear under <b>Online Bookings</b>.</div>
 <div class="grid g2">
 <div class="field"><label>Booking WhatsApp</label><input id="wWa" value="${esc(s.whatsapp)}"></div>
 <div class="field"><label>Support Name</label><input id="wSn" value="${esc(s.support.name)}"></div>
 <div class="field"><label>Support Phone</label><input id="wSp" value="${esc(s.support.phone)}"></div>
 <div class="field"><label>Support Email</label><input id="wSe" value="${esc(s.support.email)}"></div></div>
 <button class="btn" onclick="saveWeb()">Save</button>
 <div style="margin-top:16px"><b>Patient booking link (copy into your website):</b>
 <div class="note" style="margin-top:6px;font-family:monospace;font-size:12px">Book online at ${esc(s.website)} — or WhatsApp ${esc(s.whatsapp)}</div></div>`; }
function saveWeb(){ Object.assign(S.settings,{whatsapp:document.getElementById('wWa').value.trim(),support:{name:document.getElementById('wSn').value.trim(),phone:document.getElementById('wSp').value.trim(),email:document.getElementById('wSe').value.trim()}}); save(); paintChrome(); render(); toast('Saved'); }
function cloudTab(){ const c=S.settings.cloud; return `<div class="note" style="margin-bottom:12px">Optional: connect a Supabase project to sync bookings/patients across devices. The app works fully offline without it. Never paste a <b>service_role</b> key here — use the public <b>anon</b> key only.</div>
 <div class="grid g2">
 <div class="field"><label>Supabase URL</label><input id="cUrl" value="${esc(c.url)}" placeholder="https://xxxx.supabase.co"></div>
 <div class="field"><label>Supabase Anon Key</label><input id="cKey" value="${esc(c.key)}" placeholder="eyJhbGciOi…"></div></div>
 <div class="row"><button class="btn" onclick="saveCloud()">Save</button><button class="btn ghost" onclick="testCloud()">Test Connection</button></div>
 <div id="cloudMsg" style="margin-top:10px"></div>`; }
function saveCloud(){ S.settings.cloud={url:document.getElementById('cUrl').value.trim(),key:document.getElementById('cKey').value.trim()}; save(); toast('Saved'); }
async function testCloud(){ const c=S.settings.cloud; const m=document.getElementById('cloudMsg'); if(!c.url){m.innerHTML='<span style="color:#d63b3b">Enter a URL first</span>';return;} m.textContent='Testing…';
 try{ const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/',{headers:{apikey:c.key,Authorization:'Bearer '+c.key}}); m.innerHTML=r.ok?'<span style="color:#1a9e63">Connected ✓</span>':'<span style="color:#d08a00">Reached server (HTTP '+r.status+') — check anon key</span>'; }
 catch(e){ m.innerHTML='<span style="color:#d63b3e">Could not reach server: '+esc(e.message)+'</span>'; } }

/* ---------------- BACKUP ---------------- */
function vBackup(){
 return `<div class="grid g2">
  <div class="card"><div class="hd"><h3>Export Backup</h3></div><div class="bd"><p class="tag">Download all patients, invoices, results, bookings and settings as a JSON file.</p><button class="btn" onclick="exportData()">⬇ Download JSON Backup</button></div></div>
  <div class="card"><div class="hd"><h3>Import Backup</h3></div><div class="bd"><p class="tag">Restore from a previously exported JSON backup. This replaces current data.</p><input type="file" id="impFile" accept=".json"><button class="btn ghost" style="margin-top:8px" onclick="importData()">⬆ Import & Replace</button></div></div>
  <div class="card"><div class="hd"><h3>Export Records (CSV)</h3></div><div class="bd"><p class="tag">Spreadsheet-friendly exports for accounting.</p><button class="btn ghost" onclick="exportCSV('patients')">Patients CSV</button> <button class="btn ghost" onclick="exportCSV('invoices')">Invoices CSV</button></div></div>
  <div class="card"><div class="hd"><h3 style="color:#b02c2c">Danger Zone</h3></div><div class="bd"><p class="tag">Permanently erase all local data and reset to defaults.</p><button class="btn bad" onclick="resetAll()">Reset All Data</button></div></div>
 </div>`;
}
function download(name,text,type){ const b=new Blob([text],{type:type||'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportData(){ download('pathlab-backup-'+today()+'.json',JSON.stringify(S,null,2)); toast('Backup downloaded'); }
function importData(){
 const f=document.getElementById('impFile').files[0]; if(!f){toast('Choose a file first');return;}
 const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.tests) throw 0; S=d; save(); paintChrome(); render(); toast('Data imported'); }catch(e){ toast('Invalid backup file'); } }; r.readAsText(f);
}
function exportCSV(kind){
 let rows=[];
 if(kind==='patients'){ rows.push(['MRN','Name','Age','Sex','Phone','Address','ReferredBy','Registered']); S.patients.forEach(p=>rows.push([p.mrn,p.name,p.age,p.sex,p.phone,p.address,doctorById(p.doctorId).name,fmtDate(p.createdAt)])); }
 else{ rows.push(['Invoice','Date','Patient','MRN','Tests','Subtotal','Discount','GST','Total','Paid','Due','Status']); S.invoices.forEach(i=>{const c=invComputed(i); rows.push([i.no,fmtDate(i.createdAt),patientById(i.patientId).name,patientById(i.patientId).mrn,i.items.map(x=>x.name).join('; '),c.sub.toFixed(2),c.disc.toFixed(2),c.gst.toFixed(2),c.total.toFixed(2),c.paid.toFixed(2),c.due.toFixed(2),statusOf(i)]);}); }
 const csv=rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
 download(kind+'-'+today()+'.csv',csv,'text/csv'); toast('CSV downloaded');
}
function resetAll(){ if(!confirm('Reset ALL data? This cannot be undone. Export a backup first.'))return; if(!confirm('Are you absolutely sure?'))return; S=defaultState(); save(); paintChrome(); go('dashboard'); toast('All data reset'); }

/* ---------------- GLOBAL SEARCH ---------------- */
function globalSearch(q){
 if(!q||q.length<2) return;
 const p=S.patients.filter(x=>[x.name,x.mrn,x.phone].join(' ').toLowerCase().includes(q.toLowerCase()));
 const iv=S.invoices.filter(x=>[x.no,patientById(x.patientId).name].join(' ').toLowerCase().includes(q.toLowerCase()));
 modal('Search results for "'+q+'"',`${p.length?'<div style="font-weight:700;margin-bottom:6px">Patients</div><table><tbody>'+p.slice(0,8).map(x=>`<tr><td><b>${esc(x.name)}</b><div class="tag">${esc(x.mrn)} · ${esc(x.phone||'')}</div></td><td><button class="btn sm ghost" onclick="closeModal();go('patients')">Open</button></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No matching patients</div>'}
 ${iv.length?'<div style="font-weight:700;margin:12px 0 6px">Invoices</div><table><tbody>'+iv.slice(0,8).map(x=>`<tr><td><b>${esc(x.no)}</b><div class="tag">${esc(patientById(x.patientId).name)} · ${money(invComputed(x).total)}</div></td><td><button class="btn sm ghost" onclick="closeModal();viewInvoice('${x.id}')">View</button></td></tr>`).join('')+'</tbody></table>':'<div class="empty">No matching invoices</div>'}`);
}

/* ---------------- BOOT ---------------- */
restoreSession();
document.getElementById('lgPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
window.addEventListener('load',()=>{ if(!window.JsBarcode) console.warn('Barcode lib offline — using built-in fallback'); });
</script>
